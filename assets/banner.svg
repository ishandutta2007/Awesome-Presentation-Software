<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(99, 102, 241, 0.25)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.15)" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(236, 72, 153, 0.25)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.15)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1.5deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    @keyframes slideIn {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .floating-card-1 { animation: float1 6s ease-in-out infinite; }
    .floating-card-2 { animation: float2 7s ease-in-out infinite; }
    .glow-bg { animation: pulseGlow 4s ease-in-out infinite; }
    .main-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Animated Glow Orbs in Background (behind text) -->
  <circle cx="200" cy="100" r="140" fill="#6366f1" class="glow-bg" opacity="0.3" filter="url(#glow)" />
  <circle cx="1000" cy="220" r="160" fill="#d946ef" class="glow-bg" opacity="0.25" filter="url(#glow)" />

  <!-- Animated Floating Deck Graphic (Right Side Background) -->
  <g class="floating-card-1" transform="translate(820, 45)">
    <!-- Slide 1 -->
    <rect x="0" y="0" width="280" height="170" rx="10" fill="url(#cardGrad1)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <rect x="20" y="25" width="120" height="14" rx="4" fill="#818cf8" opacity="0.9" />
    <rect x="20" y="50" width="220" height="8" rx="3" fill="#94a3b8" opacity="0.6" />
    <rect x="20" y="66" width="180" height="8" rx="3" fill="#94a3b8" opacity="0.6" />
    <!-- Mini Chart Graphic -->
    <rect x="20" y="95" width="20" height="50" rx="3" fill="#6366f1" />
    <rect x="50" y="110" width="20" height="35" rx="3" fill="#a855f7" />
    <rect x="80" y="80" width="20" height="65" rx="3" fill="#ec4899" />
    <rect x="110" y="100" width="20" height="45" rx="3" fill="#38bdf8" />
  </g>

  <g class="floating-card-2" transform="translate(880, 110)">
    <!-- Slide 2 -->
    <rect x="0" y="0" width="260" height="160" rx="10" fill="url(#cardGrad2)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
    <circle cx="45" cy="45" r="20" fill="#f472b6" opacity="0.8" />
    <rect x="80" y="35" width="140" height="12" rx="4" fill="#f43f5e" opacity="0.9" />
    <rect x="80" y="55" width="100" height="8" rx="3" fill="#cbd5e1" opacity="0.7" />
    <rect x="25" y="85" width="210" height="50" rx="6" fill="rgba(255,255,255,0.08)" />
    <text x="40" y="115" class="badge-text" fill="#38bdf8">💡 AI Pitch Deck Generator</text>
  </g>

  <!-- FOREGROUND TEXT (Clear and Unobscured) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="240" height="32" rx="16" fill="rgba(255, 255, 255, 0.1)" stroke="url(#accent1)" stroke-width="1.5" />
      <text x="16" y="21" class="badge-text">📊 AWESOME LIST 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" class="main-title" filter="url(#glow)">Awesome Presentation Software</text>

    <!-- Gradient Divider Line -->
    <rect x="0" y="162" width="620" height="4" rx="2" fill="url(#accent1)" />

    <!-- Subtitle -->
    <text x="0" y="202" class="subtitle">Curated SaaS Platforms, AI Decks &amp; Open-Source Slide Frameworks</text>

    <!-- Category Feature Pills -->
    <g transform="translate(0, 232)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="145" height="34" rx="8" fill="rgba(99, 102, 241, 0.2)" stroke="#818cf8" stroke-width="1" />
        <text x="14" y="22" class="badge-text">💻 Desktop Apps</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(157, 0)">
        <rect x="0" y="0" width="155" height="34" rx="8" fill="rgba(168, 85, 247, 0.2)" stroke="#c084fc" stroke-width="1" />
        <text x="14" y="22" class="badge-text">⚡️ AI Deck Generators</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(324, 0)">
        <rect x="0" y="0" width="165" height="34" rx="8" fill="rgba(236, 72, 153, 0.2)" stroke="#f472b6" stroke-width="1" />
        <text x="14" y="22" class="badge-text">📝 Markdown-to-Slides</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(501, 0)">
        <rect x="0" y="0" width="160" height="34" rx="8" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1" />
        <text x="14" y="22" class="badge-text">🌐 Web-Native Decks</text>
      </g>
    </g>
  </g>
</svg>
